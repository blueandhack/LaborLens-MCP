[project]
name = "laborlens-mcp"
version = "0.1.0"
description = "MCP server exposing LaborLens DOL prevailing wage & PERM case search"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
laborlens-mcp = "server:mcp.run"

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
